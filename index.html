<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nosso planeta e nossas responsabilidades</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#eaf8e4;--bg2:#b4e6bb;--card:rgba(255,255,255,.88);--ink:#0f3d22;--muted:#3f6551;--g:#23853f;--on-g:#fff;--line:rgba(35,133,63,.35);--tint:rgba(35,133,63,.1);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#05200f;--bg2:#0e4020;--card:rgba(8,38,20,.82);--ink:#e8f8ec;--muted:#a9d2b7;--g:#4cc46f;--on-g:#05200f;--line:rgba(76,196,111,.4);--tint:rgba(76,196,111,.12)}}
:root[data-theme="dark"]{--bg1:#05200f;--bg2:#0e4020;--card:rgba(8,38,20,.82);--ink:#e8f8ec;--muted:#a9d2b7;--g:#4cc46f;--on-g:#05200f;--line:rgba(76,196,111,.4);--tint:rgba(76,196,111,.12)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;font-family:"Fredoka",system-ui,sans-serif;color:var(--ink);background-color:var(--bg1);background-image:radial-gradient(circle at 72% 45%,var(--bg2),var(--bg1) 70%)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;display:flex;align-items:center;padding:max(16px,env(safe-area-inset-top)) 5vw max(16px,env(safe-area-inset-bottom));pointer-events:none}
.card{pointer-events:auto;width:min(540px,100%);max-height:100%;overflow-y:auto;background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:2px solid var(--line);border-radius:26px;padding:26px;box-shadow:0 18px 48px rgba(0,0,0,.2)}
@media (max-width:800px){#ui{align-items:flex-end;padding:12px}.card{max-height:62%;padding:18px;border-radius:22px}}
h1{font-size:clamp(1.7rem,4.2vw,2.5rem);line-height:1.08;margin:.35em 0 .1em}
h2{font-size:1.25rem;line-height:1.3;margin:14px 0}
p{color:var(--muted);line-height:1.5;margin:.6em 0 1.1em}
.tag{display:inline-block;background:var(--g);color:var(--on-g);padding:4px 14px;border-radius:99px;font-size:.9rem;font-weight:600;margin:0}
.top{display:flex;justify-content:space-between;font-weight:600;color:var(--muted);font-size:.95rem}
.bar{height:9px;background:var(--tint);border-radius:9px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--g);transition:width .4s}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;font:inherit;font-size:1rem;color:var(--ink);background:var(--tint);border:2px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;transition:transform .12s,border-color .12s}
.opt:hover:not(:disabled){transform:translateX(4px);border-color:var(--g)}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--g);color:var(--on-g);font-size:.85rem}
.opt:disabled{cursor:default}
.opt:disabled:not(.ok):not(.bad){opacity:.55}
.opt.ok{background:#23853f;border-color:#23853f;color:#fff}
.opt.bad{background:#c0392b;border-color:#c0392b;color:#fff}
.opt.ok b,.opt.bad b{background:#fff;color:#14301f}
.fb{margin-top:12px;line-height:1.45}
.fb:empty{display:none}
.btn{font:inherit;font-weight:700;font-size:1.05rem;background:var(--g);color:var(--on-g);border:0;border-radius:99px;padding:12px 28px;cursor:pointer;margin-top:10px}
.btn:hover{filter:brightness(1.1)}
:focus-visible{outline:3px solid #f5b700;outline-offset:2px}
.score{font-size:3rem;font-weight:700;color:var(--g);margin:.1em 0 0}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<main id="ui"><section class="card" id="card"></section></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const card=$("#card");
const Q=[
["Qual gás é o principal responsável pelo agravamento do efeito estufa causado pelas atividades humanas?",["Gás carbônico (CO₂)","Oxigênio (O₂)","Nitrogênio (N₂)","Hélio (He)"],"Queimar combustíveis e desmatar liberam CO₂, que retém calor na atmosfera."],
["Na coleta seletiva, qual é a cor da lixeira destinada ao papel?",["Azul","Verde","Amarelo","Vermelho"],"Azul é papel. Verde é vidro, amarelo é metal e vermelho é plástico."],
["Qual atitude ajuda a economizar água em casa?",["Fechar a torneira ao escovar os dentes","Tomar banhos bem demorados","Lavar a calçada com mangueira","Deixar a torneira pingando"],"Pequenos gestos, repetidos todos os dias, poupam muitos litros de água."],
["Aproximadamente quanto da água do planeta é doce, ou seja, sem sal?",["Cerca de 3%","Cerca de 25%","Cerca de 50%","Cerca de 97%"],"Cerca de 97% da água é salgada. A água doce é pouca, e boa parte está em geleiras. Por isso devemos cuidar dela."],
["Qual é o maior bioma do Brasil?",["Amazônia","Cerrado","Mata Atlântica","Pampa"],"A Amazônia ocupa quase metade do território brasileiro e abriga uma enorme biodiversidade."],
["Qual processo permite que as plantas produzam seu alimento, absorvendo gás carbônico e liberando oxigênio?",["Fotossíntese","Respiração","Digestão","Evaporação"],"Na fotossíntese, as plantas usam luz, água e CO₂. Por isso as árvores ajudam a equilibrar o clima."],
["Qual destas é uma fonte de energia renovável?",["Energia solar","Carvão mineral","Petróleo","Gás natural"],"O Sol não se esgota. Carvão, petróleo e gás natural são combustíveis fósseis e poluem mais."],
["Usar uma garrafa de vidro várias vezes, em vez de jogá-la fora, é exemplo de qual “R”?",["Reutilizar","Reciclar","Reduzir","Reflorestar"],"Reutilizar é dar novo uso a um objeto antes de descartá-lo."],
["Quanto tempo uma garrafa plástica pode levar para se decompor na natureza?",["Centenas de anos","Cerca de 2 meses","Cerca de 1 ano","Cerca de 10 anos"],"O plástico demora séculos para desaparecer. Vale reduzir, reutilizar e reciclar."],
["Qual camada da atmosfera nos protege de grande parte dos raios ultravioleta do Sol?",["Camada de ozônio","Camada de nuvens","Camada de poeira","Camada de vapor"],"O gás ozônio filtra os raios UV, que podem prejudicar a pele e os seres vivos."],
["Em que data é comemorado o Dia Mundial do Meio Ambiente?",["5 de junho","22 de abril","7 de setembro","12 de outubro"],"É em 5 de junho. O dia 22 de abril é o Dia da Terra."],
["O que significa desenvolvimento sustentável?",["Atender às necessidades de hoje sem prejudicar as das futuras gerações","Usar todos os recursos naturais o mais rápido possível","Deixar de usar qualquer recurso da natureza","Produzir cada vez mais, sem se preocupar com o lixo"],"É crescer cuidando da natureza, para que as próximas gerações também tenham o que precisam."]
];
let order=[],i=0,score=0,locked=false,G=null;
const shuffle=a=>{for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};

function init3D(){
 const T=window.THREE;if(!T)return null;
 const r=new T.WebGLRenderer({canvas:$("#c"),antialias:true,alpha:true});
 r.setPixelRatio(Math.min(devicePixelRatio,2));
 const sc=new T.Scene(),cam=new T.PerspectiveCamera(40,1,.1,100);cam.position.z=7;
 sc.add(new T.AmbientLight(0xffffff,.8));
 const sun=new T.DirectionalLight(0xffffff,.9);sun.position.set(4,3,5);sc.add(sun);
 const rig=new T.Group();sc.add(rig);
 let s=11;const rnd=()=>(s=s*16807%2147483647)/2147483647;
 const tc=document.createElement("canvas");tc.width=1024;tc.height=512;const x=tc.getContext("2d");
 x.fillStyle="#2b83c9";x.fillRect(0,0,1024,512);
 for(let n=0;n<80;n++){x.fillStyle=rnd()>.3?"#3fae5a":"#9cc85a";x.beginPath();x.ellipse(rnd()*1024,70+rnd()*372,18+rnd()*70,12+rnd()*38,rnd()*3,0,7);x.fill()}
 x.fillStyle="#fff";x.fillRect(0,0,1024,26);x.fillRect(0,486,1024,26);
 const earth=new T.Mesh(new T.SphereGeometry(1.6,48,48),new T.MeshStandardMaterial({map:new T.CanvasTexture(tc),roughness:.9}));
 earth.rotation.z=.2;rig.add(earth);
 const glow=new T.Mesh(new T.SphereGeometry(1.78,40,40),new T.MeshBasicMaterial({color:0x4cc46f,transparent:true,opacity:.05,side:T.BackSide}));
 rig.add(glow);
 const N=140,pa=new Float32Array(N*3);
 for(let k=0;k<N;k++){pa[k*3]=(rnd()-.5)*18;pa[k*3+1]=(rnd()-.5)*11;pa[k*3+2]=-6+rnd()*7}
 const parts=new T.Points(new T.BufferGeometry().setAttribute("position",new T.BufferAttribute(pa,3)),new T.PointsMaterial({color:0x4cc46f,size:.07,transparent:true,opacity:.7}));
 sc.add(parts);
 const pts=[],grow=[],up=new T.Vector3(0,1,0);
 for(let k=0;k<12;k++){const y=1-2*(k+.5)/12,rad=Math.sqrt(1-y*y),th=k*2.399963;pts.push(new T.Vector3(Math.cos(th)*rad,y,Math.sin(th)*rad))}
 const trunkM=new T.MeshStandardMaterial({color:0x7a4a21}),leafM=new T.MeshStandardMaterial({color:0x1f9d4a});
 function tree(p){
  const g=new T.Group(),tr=new T.Mesh(new T.CylinderGeometry(.04,.05,.25,6),trunkM);tr.position.y=.12;
  const c1=new T.Mesh(new T.ConeGeometry(.2,.35,8),leafM);c1.position.y=.38;
  const c2=new T.Mesh(new T.ConeGeometry(.15,.3,8),leafM);c2.position.y=.58;
  g.add(tr,c1,c2);g.position.copy(p).multiplyScalar(1.6);g.quaternion.setFromUnitVectors(up,p.clone().normalize());
  g.scale.setScalar(.001);g.userData.t=0;earth.add(g);grow.push(g);
 }
 const base={x:0,y:0};let tx=0,ty=0,shake=0,lvl=0,shown=0;
 function layout(){const w=innerWidth,h=innerHeight,wide=w>800;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();base.x=wide?Math.max(0,2.55*cam.aspect-1.95):0;base.y=wide?0:1.3;rig.scale.setScalar(wide?.95:.62)}
 layout();addEventListener("resize",layout);
 addEventListener("pointermove",e=>{tx=e.clientX/innerWidth-.5;ty=e.clientY/innerHeight-.5});
 (function tick(){
  requestAnimationFrame(tick);const t=performance.now();
  earth.rotation.y+=.003;
  rig.rotation.y+=(tx*.4-rig.rotation.y)*.05;rig.rotation.x+=(ty*.25-rig.rotation.x)*.05;
  grow.forEach(g=>{if(g.userData.t<1){g.userData.t=Math.min(1,g.userData.t+.04);g.scale.setScalar(1-Math.pow(1-g.userData.t,3)+.001)}});
  shown+=(lvl-shown)*.05;earth.material.color.setRGB(.5+.5*shown,.54+.46*shown,.47+.53*shown);glow.material.opacity=.05+.3*shown;
  shake*=.92;rig.position.set(base.x+Math.sin(t/25)*shake*.12,base.y+Math.sin(t/900)*.05,0);
  parts.rotation.y+=.0008;r.render(sc,cam);
 })();
 return{
  ok(n){lvl=n/12;tree(pts[n-1])},
  bad(){shake=1},
  reset(){earth.children.slice().forEach(c=>earth.remove(c));grow.length=0;lvl=0}
 };
}
try{G=init3D()}catch(e){console.error(e)}

function showStart(){
 card.innerHTML='<p class="tag">Mostra Pedagógica do 7º ano</p><h1>Nosso planeta e nossas responsabilidades</h1><p>Responda 12 perguntas. A cada acerto, uma árvore nasce no planeta 3D. Vamos deixar a Terra mais verde?</p><button class="btn" id="go">Jogar 🌱</button>';
 $("#go").onclick=begin;
}
function begin(){order=shuffle([...Q.keys()]);i=0;score=0;if(G)G.reset();showQ()}
function showQ(){
 const q=Q[order[i]];locked=false;
 card.innerHTML='<div class="top"><span>Pergunta '+(i+1)+' de 12</span><span>🌳 '+score+'</span></div><div class="bar"><i style="width:'+(i/12*100)+'%"></i></div><h2></h2><div class="opts"></div><div class="fb" aria-live="polite"></div>';
 card.querySelector("h2").textContent=q[0];
 const box=card.querySelector(".opts");
 shuffle(q[1].map((t,k)=>({t,c:k===0}))).forEach((o,k)=>{
  const b=document.createElement("button");b.className="opt";b.innerHTML="<b>"+"ABCD"[k]+"</b><span></span>";
  b.lastChild.textContent=o.t;b._c=o.c;b.onclick=()=>pick(b,o.c,q);box.appendChild(b);
 });
 card.scrollTop=0;
}
function pick(b,right,q){
 if(locked)return;locked=true;
 card.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x._c)x.classList.add("ok")});
 if(right){score++;if(G)G.ok(score)}else{b.classList.add("bad");if(G)G.bad()}
 const last=i===11,fb=card.querySelector(".fb");
 fb.innerHTML=(right?"<strong>✅ Isso mesmo!</strong> ":"<strong>❌ Quase!</strong> ")+q[2]+'<br><button class="btn" id="nx">'+(last?"Ver resultado":"Próxima pergunta")+"</button>";
 const nx=$("#nx");nx.onclick=()=>{if(last)showEnd();else{i++;showQ()}};nx.focus();
}
function showEnd(){
 const t=score>=11?["🏆","Guardião do Planeta!"]:score>=8?["🌳","Protetor da Natureza!"]:score>=5?["🌿","Semente em crescimento!"]:["🌱","Vamos plantar mais conhecimento!"];
 card.innerHTML='<p class="tag">Fim de jogo</p><p class="score">'+t[0]+" "+score+'/12</p><h1>'+t[1]+'</h1><p>Você plantou '+score+(score===1?" árvore":" árvores")+" no planeta. Reduzir, reutilizar e reciclar: pequenas atitudes, todos os dias, fazem a diferença.</p>"+'<button class="btn" id="again">Jogar de novo</button>';
 $("#again").onclick=begin;
}
document.addEventListener("keydown",e=>{const b=card.querySelectorAll(".opt")[+e.key-1];if(b)b.click()});
showStart();
</script>
</body>
</html>
